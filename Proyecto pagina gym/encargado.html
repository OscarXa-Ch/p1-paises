<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>Panel del encargado | Gimnasio ITSL</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-gym navbar-dark navbar-expand-md">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="encargado.html">
          <img src="logo.png" alt="Logo del gimnasio universitario"> Gimnasio ITSL
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-3">
            <li class="nav-item"><a class="nav-link active" href="encargado.html">Panel</a></li>
            <li class="nav-item"><span class="navbar-text nombre-usuario"></span></li>
            <li class="nav-item"><button class="btn btn-outline-light btn-sm btn-cerrar-sesion" type="button">Cerrar sesión</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4">Panel de asistencia</h1>
    <div class="row g-4">
      <section class="col-12 col-lg-4">
        <div class="card tarjeta mb-4">
          <div class="card-body">
            <h2 class="h6 text-secondary">Aforo actual</h2>
            <div class="contador mb-3" id="ocupacion">0<small> / 25</small></div>
            <div class="progress" role="progressbar" aria-label="Aforo del gimnasio" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0">
              <div id="barraAforo" class="progress-bar bg-success" style="width:0"></div>
            </div>
            <p class="mt-3 mb-0">Lugares disponibles: <strong id="disponibles">25</strong></p>
          </div>
        </div>
        <div class="card tarjeta">
          <div class="card-body">
            <h2 class="h5 mb-3">Registrar alumno</h2>
            <form id="formAsistencia" novalidate>
              <label for="busqueda" class="form-label">Número de control o nombre</label>
              <input type="text" id="busqueda" class="form-control mb-1" placeholder="Ej. 20230001 o Ana López" autocomplete="off" required>
              <div class="invalid-feedback">Escribe al menos 3 caracteres.</div>
              <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-primary" data-accion="entrada">Registrar entrada</button>
                <button type="submit" class="btn btn-outline-secondary" data-accion="salida">Registrar salida</button>
              </div>
              <div id="coincidencias" class="list-group mt-3"></div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-8">
        <div class="card tarjeta">
          <div class="card-body">
            <ul class="nav nav-tabs mb-3" role="tablist">
              <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPresentes" type="button" role="tab">Dentro ahora</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabHistorial" type="button" role="tab">Historial</button></li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="tabPresentes" role="tabpanel">
                <div class="table-responsive tabla-scroll">
                  <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Control</th><th>Alumno</th><th>Entrada</th><th>Tiempo</th><th></th></tr></thead>
                    <tbody id="tablaPresentes"></tbody>
                  </table>
                </div>
              </div>
              <div class="tab-pane fade" id="tabHistorial" role="tabpanel">
                <label for="filtroHistorial" class="form-label">Filtrar por nombre o control</label>
                <input type="search" id="filtroHistorial" class="form-control mb-3" placeholder="Buscar...">
                <div class="table-responsive tabla-scroll">
                  <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Control</th><th>Alumno</th><th>Entrada</th><th>Salida</th><th>Duración</th></tr></thead>
                    <tbody id="tablaHistorial"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="modalSalida" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="tituloModal">Confirmar salida</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">¿Registrar la salida de <strong id="nombreSalida"></strong>?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmarSalida">Registrar salida</button>
        </div>
      </div>
    </div>
  </div>
  <div id="zonaToast" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="encargado.js"></script>
</body>
</html>
