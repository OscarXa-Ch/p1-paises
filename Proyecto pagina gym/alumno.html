<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>Mi estancia | Gimnasio ITSL</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-gym navbar-dark navbar-expand-md">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="alumno.html">
          <img src="logo.png" alt="Logo del gimnasio universitario"> Gimnasio ITSL
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-3">
            <li class="nav-item"><a class="nav-link active" href="alumno.html">Mi estancia</a></li>
            <li class="nav-item"><span class="navbar-text nombre-usuario"></span></li>
            <li class="nav-item"><button class="btn btn-outline-light btn-sm btn-cerrar-sesion" type="button">Cerrar sesión</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-4">Mi estancia en el gimnasio</h1>
    <div class="row g-4">
      <section class="col-12 col-lg-6">
        <div class="card tarjeta h-100 text-center">
          <div class="card-body py-4">
            <p class="text-secondary mb-1">Tiempo transcurrido</p>
            <div class="cronometro mb-2" id="cronometro">00:00:00</div>
            <p class="mb-4">Entrada: <strong id="horaEntrada">--</strong></p>
            <button id="btnSalir" class="btn btn-danger btn-lg" type="button">Salir del gimnasio</button>
          </div>
        </div>
      </section>
      <section class="col-12 col-lg-6">
        <div class="card tarjeta h-100">
          <div class="card-body">
            <h2 class="h6 text-secondary">Ocupación actual</h2>
            <p class="h3 mb-3" id="ocupacion">-- / 25</p>
            <div class="progress" role="progressbar" aria-label="Ocupación del gimnasio" aria-valuemin="0" aria-valuemax="25">
              <div id="barraAforo" class="progress-bar" style="width:0"></div>
            </div>
            <p class="pie mt-3 mb-0">Tu lugar cuenta como 1 persona dentro del edificio.</p>
          </div>
        </div>
      </section>
      <section class="col-12">
        <div class="card tarjeta">
          <div class="card-body">
            <h2 class="h5 mb-3">Mis visitas anteriores</h2>
            <div class="table-responsive tabla-scroll">
              <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Entrada</th><th>Salida</th><th>Duración</th></tr></thead>
                <tbody id="tablaHistorial"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="alumno.js"></script>
</body>
</html>
