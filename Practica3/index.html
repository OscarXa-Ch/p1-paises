<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos en la nube</title><link rel="stylesheet" href="styles.css"></head>
<body><header><h1>Productos en la nube</h1><p>Consulta y administra el catálogo</p></header><main>
<section class="panel"><h2>Agregar producto</h2><form id="formProducto"><input id="txtNombre" placeholder="Nombre" required><input id="txtPrecio" type="number" min="0.01" step="0.01" placeholder="Precio" required><input id="txtStock" type="number" min="1" step="1" placeholder="Stock" required><button>Agregar</button></form><p id="mensaje"></p></section>
<section><h2>Productos</h2><div id="resultados" class="productos"></div></section></main><script src="app.js"></script></body></html>
